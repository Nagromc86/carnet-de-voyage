# Construit l'appli Android (APK) à chaque modification de l'appli, et la publie dans les Releases.
# Lien fixe vers la dernière version : https://github.com/Nagromc86/carnet-de-voyage/releases/latest/download/carnet-de-voyage.apk
name: APK Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Clé de signature personnelle de l'appli (voir android/README.md). Elle doit rester la même
      # pour que chaque nouvelle APK s'installe par-dessus l'ancienne sans perdre les données.
      KS_PASS: 3xYSzi7TXOuclB8B9F4JzsJg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Préparer le projet Android
        working-directory: android
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          cp ../index.html ../icon-192.png ../icon-512.png ../icon-maskable.png www/
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          VERSION=$(grep -o "var APP_VERSION='[0-9][^']*'" ../index.html | head -1 | cut -d"'" -f2)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Construire l'APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Signer l'APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks android/carnet.jks --ks-key-alias carnet --ks-pass env:KS_PASS --key-pass env:KS_PASS --out carnet-de-voyage.apk aligned.apk
          "$BT/apksigner" verify --print-certs carnet-de-voyage.apk | head -3
          ls -la carnet-de-voyage.apk

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" carnet-de-voyage.apk \
            --title "Carnet de voyage 1.${{ github.run_number }} ($APP_VERSION)" \
            --notes "Appli Android du Carnet de voyage, version de l'appli du $APP_VERSION. Télécharge carnet-de-voyage.apk sur ton téléphone puis ouvre-le pour l'installer (ou la mettre à jour : ton carnet est conservé)." \
            --latest
